name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Cache VS Code downloads
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: pnpm run test:integration

      - name: Package extension
        if: runner.os == 'Linux'
        run: pnpm run package
